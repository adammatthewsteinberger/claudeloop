[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudeloop"
version = "0.5.3"
description = "Onion-architected, autonomous Claude Code session runner and full Anthropic SDK CLI — never blocks on a human, distinguishes rate limits from exhausted credits, and resumes safely across usage windows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Matthew Steinberger", email = "adam@matthewsteinberger.com" }]
keywords = [
    "claude",
    "claude-code",
    "anthropic",
    "cli",
    "automation",
    "agent",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "structlog>=24.1",
    "claude-agent-sdk>=0.2.134",
    "anthropic>=0.40",
    "textual>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/adammatthewsteinberger/claudeloop"
Repository = "https://github.com/adammatthewsteinberger/claudeloop"
Documentation = "https://adammatthewsteinberger.github.io/claudeloop/"
Issues = "https://github.com/adammatthewsteinberger/claudeloop/issues"
Changelog = "https://github.com/adammatthewsteinberger/claudeloop/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "import-linter>=2.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.0",
    "pyyaml>=6.0",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
voice = [
    # Optional STT/TTS extras — CLI falls back to system `say`/`espeak` without these.
    "openai-whisper>=20231117; platform_system != 'Windows'",
]

[project.scripts]
claudeloop = "claudeloop.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeloop"]

[tool.ruff]
line-length = 100
target-version = "py310"
# legacy/ is a frozen historical reference (see its own module docstring and
# .gitattributes' linguist-vendored marker) — it is deliberately not held to
# the live lint config, since "unmodified in behavior" is the whole point.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Typer's own idiom is `param: T = typer.Option(...)` / `typer.Argument(...)`
# in a function signature default — B008 (no function calls in defaults)
# exists to catch a different, real mutable-default bug and doesn't know
# Typer's sentinels are safe here. This is the standard fix for Typer/FastAPI
# projects rather than restructuring every command against the library's own
# documented pattern.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["claudeloop"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately NO --cov=... and NO --cov-fail-under here. pytest-cov MERGES
# (unions) every --cov=X flag it sees rather than letting the last one win —
# so a blanket `--cov=claudeloop` baked into addopts would silently widen
# every explicitly-scoped invocation (e.g. CI's
# `--cov=claudeloop.domain --cov=claudeloop.application --cov-fail-under=100`)
# back out to the whole package, defeating the per-layer gate without any
# error. Coverage scope and its gate are passed explicitly at each call site
# instead — see docs/contributing/testing.md and .github/workflows/ci.yml.
addopts = "--cov-report=term-missing -m \"not live and not system\""
asyncio_mode = "auto"
markers = [
    "live: exercises a real Claude account (free tier — no token spend). Opt in with -m live.",
    "paid: additionally spends real tokens/turns. Requires --run-paid-live. Always paired with 'live'.",
    "system: deterministic system-live harness (real FS/git/CLI adapters + scripted agent). Opt in with -m system.",
]

[tool.coverage.run]
branch = true
source = ["src/claudeloop"]
# bootstrap.py is an intentional composition-root stub until M2 wires real
# adapters into it (see docs/architecture/ports-and-adapters.md) — it has no
# behavior to test yet. Omitting it here (rather than lowering the domain +
# application 100% gate, or padding it with a placeholder test) keeps the
# coverage floor an honest measure of tested behavior. Remove this omit the
# moment bootstrap.py gains real content.
omit = ["src/claudeloop/bootstrap.py"]

[tool.importlinter]
root_package = "claudeloop"

[[tool.importlinter.contracts]]
name = "Onion layering"
type = "layers"
layers = [
    "claudeloop.cli",
    "claudeloop.bootstrap",
    "claudeloop.application",
    "claudeloop.domain",
]

[[tool.importlinter.contracts]]
name = "Infrastructure only reachable from bootstrap"
type = "forbidden"
source_modules = ["claudeloop.domain", "claudeloop.application"]
forbidden_modules = ["claudeloop.infrastructure"]
