name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src/autoclaude

  imports:
    name: import-linter (onion contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: lint-imports

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -q -r src/autoclaude
      - run: pip-audit

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run domain + application tests at the 100% coverage floor
        run: |
          pytest tests/domain tests/application \
            --cov=autoclaude.domain --cov=autoclaude.application \
            --cov-report=term-missing --cov-fail-under=100
      - name: Run the full suite (lower floor — infrastructure/cli are still being built)
        run: pytest --cov-report=term-missing --cov-fail-under=0

  skills:
    name: Claude skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pyyaml
      - run: python scripts/check_skill_frontmatter.py

  build:
    name: Package builds and is installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Confirm py.typed ships in the wheel
        run: unzip -l dist/*.whl | grep -q py.typed
      - name: Install the built wheel into a clean venv and run the console script
        # This is the check whose absence let a broken [project.scripts] entry
        # point ship undetected — installing editable never validates it.
        run: |
          python -m venv /tmp/autoclaude-smoke
          /tmp/autoclaude-smoke/bin/pip install --upgrade pip
          /tmp/autoclaude-smoke/bin/pip install dist/*.whl
          /tmp/autoclaude-smoke/bin/autoclaude --version
          /tmp/autoclaude-smoke/bin/autoclaude --help
