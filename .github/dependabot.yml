version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["dependencies", "python"]

  # GitHub Actions — this is what makes SHA-pinning the actions in
  # publish-to-pypi.yml sustainable rather than rot-inducing: Dependabot
  # understands `# vX.Y.Z` trailing comments on a pinned SHA and opens a PR
  # bumping both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  # pre-commit hook revisions (.pre-commit-config.yaml)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "pre-commit"]
